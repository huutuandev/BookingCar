name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production to Vercel
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deployment.outputs.url }}
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: https://booking-car-pi.vercel.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Verify Vercel configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.2
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Package validated static build for Vercel
        run: node .github/scripts/package-vercel.mjs
      - name: Deploy prebuilt output
        id: deployment
        shell: bash
        run: |
          deployment_url=$(vercel deploy --yes --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Production domain: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production domain serves this build
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL/?ci=$GITHUB_SHA" -o /tmp/production-index.html \
              && cmp -s Frontend/dist/index.html /tmp/production-index.html; then
              echo "Verified production build at $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production domain does not serve this build. Check that booking-car-pi.vercel.app belongs to VERCEL_PROJECT_ID and is assigned to production."
          exit 1
